name: rekluti_test
description: "Gapsi Market"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. Enforces a unidirectional event -> state flow and keeps
  # business logic out of widgets.
  flutter_bloc: ^9.1.1
  # Value equality for states and events, so Bloc can skip identical emissions.
  equatable: ^2.1.0

  # HTTP client. Chosen over `http` for its interceptor pipeline, which is where
  # the RapidAPI key and error mapping are applied in a single place.
  dio: ^5.11.0

  # Local persistence (search history, credentials, cached results).
  sqflite: ^2.4.2+1
  # Builds platform-correct paths for the SQLite database file.
  path: ^1.9.1

  # Service locator. Keeps blocs decoupled from concrete implementations so
  # they can be tested against fakes.
  get_it: ^9.2.1

  # Declarative routing. Its `redirect` hook centralises the authentication
  # guard instead of scattering it across widgets.
  go_router: ^17.5.0
  # Duotone icon set used across the navigation bar and empty states.
  phosphor_flutter: ^2.1.0
  # Opens the product page in the browser from the detail screen.
  url_launcher: ^6.3.2
  # Password hashing. A deliberately slow, salted KDF: a general purpose digest
  # such as SHA-256 is far too fast to protect a stored password.
  bcrypt: ^1.2.0
  # Supplies the debounce the search transformer is built on.
  stream_transform: ^2.1.2
  # Event transformers from the bloc team. Search uses restartable so a new
  # term abandons the request already in flight.
  bloc_concurrency: ^0.3.0
  # Caches product thumbnails on disk. An infinite scroll would otherwise
  # re-download every image each time the list is rebuilt.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint set, extended in `analysis_options.yaml`.
  flutter_lints: ^6.0.0

  # Declarative assertions over the sequence of states a Bloc emits.
  bloc_test: ^10.0.0
  # Null-safe mocking without code generation.
  mocktail: ^1.0.5

  # Runs a real SQLite engine on the host VM. `sqflite` needs a platform
  # channel, so without this the database layer could only be mocked. Test
  # scope only: it never ships in the app.
  sqflite_common_ffi: ^2.4.0+3
  # Generates every icon size iOS and Android ask for from a single source
  # image. Build tooling only: it never ships in the app.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled rather than fetched at runtime. Downloading a typeface on first
  # launch means the app looks different with no connection, and different again
  # a second later once it arrives. Four static files are a smaller price than
  # that, and only the weights the design actually uses are shipped.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Regular.ttf
          weight: 400
        - asset: assets/fonts/Karla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Karla-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Icon generation. Run with: dart run flutter_launcher_icons
#
# The source lives in assets/icon but is deliberately not declared under
# `flutter: assets:`. It is consumed at build time to produce the platform icons,
# so bundling it too would ship a megabyte the app never reads.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  # iOS rejects an icon with an alpha channel, so it is flattened on the way out.
  remove_alpha_ios: true
  # Android masks adaptive icons into whatever shape the launcher uses, so the
  # foreground is the circle alone on a transparent field, over a white
  # background. Passing the full square would let the mask clip the artwork.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21
