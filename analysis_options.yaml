# Static analysis configuration.
#
# The exercise requires `flutter analyze` to run clean, so this file goes beyond
# the default lint set: the strict language modes below turn implicit `dynamic`
# and unsound casts into analysis errors instead of runtime surprises.
#
# Run with: flutter analyze

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Reject implicit downcasts from `dynamic` (e.g. raw JSON maps).
    strict-casts: true
    # Reject inference that would silently resolve a type to `dynamic`.
    strict-inference: true
    # Reject generic types used without their type arguments.
    strict-raw-types: true

  errors:
    # Unawaited futures are the usual source of race conditions in async UI
    # flows, so they must fail analysis rather than emit a warning.
    unawaited_futures: error
    # Dead or unreachable code means an intent was lost during a refactor.
    dead_code: error

  exclude:
    - build/**

linter:
  rules:
    # --- Consistency -------------------------------------------------------
    - prefer_single_quotes
    - require_trailing_commas
    - directives_ordering
    - always_use_package_imports
    - sort_constructors_first

    # --- Type safety -------------------------------------------------------
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals

    # --- Async -------------------------------------------------------------
    - unawaited_futures

    # --- Noise reduction ---------------------------------------------------
    - avoid_redundant_argument_values
    - unnecessary_lambdas
